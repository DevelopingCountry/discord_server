services:
  discord-mysql:
    image: mysql:8.0
    container_name: discord-mysql
    restart: always
    environment:
      MYSQL_DATABASE: discord_server
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  discord-redis:
    image: redis:7
    container_name: discord-redis
    restart: always
    volumes:
      - redis-data:/data

  discord-app:
    build: .
    container_name: discord-app
    restart: always
    depends_on:
      discord-mysql:
        condition: service_healthy
      discord-redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    expose:
      - "8080"

  caddy:
    image: caddy:2
    container_name: discord-caddy
    restart: always
    depends_on:
      - discord-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend-dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn:latest
    container_name: discord-coturn
    restart: always
    # UDP 미디어 릴레이 포트가 매번 임의로(range 내에서) 선택되므로, Docker 브리지로
    # 포트를 하나씩 매핑하는 대신 호스트 네트워크를 그대로 사용한다.
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--realm=discord-harmonica"
      - "--lt-cred-mech"
      - "--user=${TURN_USERNAME}:${TURN_PASSWORD}"
      - "--external-ip=${TURN_EXTERNAL_IP}"
      - "--no-cli"
      - "--fingerprint"

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config: